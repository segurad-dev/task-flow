<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Task Flow</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <script defer src="https://cdn.jsdelivr.net/npm/alpinejs@3.x.x/dist/cdn.min.js"></script>
  <script src="config.js"></script>
  <script src="api.js"></script>
  <script src="app.js"></script>
</head>
<body class="bg-gray-100 min-h-screen">

  <div
    x-data="{ authed: !!localStorage.getItem('token') }"
    @authenticated.window="authed = true"
    @logout.window="authed = false"
    class="min-h-screen"
  >

    <!-- ── Auth page ──────────────────────────────────────────────────────── -->
    <div
      x-show="!authed"
      x-transition
      class="flex items-center justify-center min-h-screen"
    >
      <div x-data="authApp()" class="w-full max-w-md">
        <div class="bg-white rounded-2xl shadow-md p-8">

          <div class="text-center mb-6">
            <h1 class="text-2xl font-bold text-gray-800">Task Flow</h1>
            <p class="text-sm text-gray-500 mt-1">Система управления задачами</p>
          </div>

          <div class="flex border-b border-gray-200 mb-6">
            <button
              @click="switchMode('login')"
              :class="mode === 'login'
                ? 'flex-1 py-2 text-sm font-medium text-indigo-600 border-b-2 border-indigo-600 focus:outline-none'
                : 'flex-1 py-2 text-sm font-medium text-gray-400 border-b-2 border-transparent hover:text-gray-600 focus:outline-none'"
            >Войти</button>
            <button
              @click="switchMode('register')"
              :class="mode === 'register'
                ? 'flex-1 py-2 text-sm font-medium text-indigo-600 border-b-2 border-indigo-600 focus:outline-none'
                : 'flex-1 py-2 text-sm font-medium text-gray-400 border-b-2 border-transparent hover:text-gray-600 focus:outline-none'"
            >Регистрация</button>
          </div>

          <div
            x-show="error"
            x-text="error"
            class="mb-4 rounded-lg bg-red-50 border border-red-200 text-red-700 text-sm px-3 py-2"
          ></div>

          <!-- Login form -->
          <form x-show="mode === 'login'" @submit.prevent="submit">
            <div class="mb-4">
              <label class="block text-sm font-medium text-gray-700 mb-1">Email</label>
              <input x-model="email" type="email" required placeholder="you@example.com"
                class="w-full border border-gray-300 rounded-lg px-3 py-2 text-sm focus:outline-none focus:ring-2 focus:ring-indigo-400" />
            </div>
            <div class="mb-6">
              <label class="block text-sm font-medium text-gray-700 mb-1">Пароль</label>
              <input x-model="password" type="password" required placeholder="••••••••"
                class="w-full border border-gray-300 rounded-lg px-3 py-2 text-sm focus:outline-none focus:ring-2 focus:ring-indigo-400" />
            </div>
            <button type="submit" :disabled="loading"
              class="w-full bg-indigo-600 hover:bg-indigo-700 disabled:opacity-50 text-white font-medium py-2 rounded-lg text-sm transition-colors">
              <span x-text="loading ? 'Входим…' : 'Войти'"></span>
            </button>
          </form>

          <!-- Register form -->
          <form x-show="mode === 'register'" @submit.prevent="submit">
            <div class="mb-4">
              <label class="block text-sm font-medium text-gray-700 mb-1">Email</label>
              <input x-model="email" type="email" required placeholder="you@example.com"
                class="w-full border border-gray-300 rounded-lg px-3 py-2 text-sm focus:outline-none focus:ring-2 focus:ring-indigo-400" />
            </div>
            <div class="mb-4">
              <label class="block text-sm font-medium text-gray-700 mb-1">Имя пользователя</label>
              <input x-model="username" type="text" required placeholder="johndoe"
                class="w-full border border-gray-300 rounded-lg px-3 py-2 text-sm focus:outline-none focus:ring-2 focus:ring-indigo-400" />
            </div>
            <div class="mb-6">
              <label class="block text-sm font-medium text-gray-700 mb-1">Пароль</label>
              <input x-model="password" type="password" required placeholder="••••••••"
                class="w-full border border-gray-300 rounded-lg px-3 py-2 text-sm focus:outline-none focus:ring-2 focus:ring-indigo-400" />
            </div>
            <button type="submit" :disabled="loading"
              class="w-full bg-indigo-600 hover:bg-indigo-700 disabled:opacity-50 text-white font-medium py-2 rounded-lg text-sm transition-colors">
              <span x-text="loading ? 'Создаём…' : 'Создать аккаунт'"></span>
            </button>
          </form>

        </div>
      </div>
    </div>

    <!-- ── Dashboard ──────────────────────────────────────────────────────── -->
    <div
      x-show="authed"
      x-data="dashboardApp()"
      x-transition
      class="flex flex-col min-h-screen"
    >

      <!-- Header -->
      <header class="bg-white border-b border-gray-200 px-6 py-3 flex items-center justify-between shrink-0">
        <span class="text-lg font-bold text-indigo-600">Task Flow</span>
        <div class="flex items-center gap-4">
          <span class="text-sm text-gray-600" x-text="username"></span>
          <button
            @click="logout()"
            class="text-sm text-gray-500 hover:text-red-500 transition-colors"
          >Выйти</button>
        </div>
      </header>

      <!-- Body: sidebar + main -->
      <div class="flex flex-1 overflow-hidden">

        <!-- Sidebar -->
        <aside class="w-64 bg-white border-r border-gray-200 flex flex-col shrink-0">
          <div class="p-4 border-b border-gray-100 flex items-center justify-between">
            <span class="text-xs font-semibold text-gray-500 uppercase tracking-wider">Проекты</span>
            <!-- "+ Новый проект" button appears in commit 6 -->
          </div>

          <!-- Project list (populated in commit 6) -->
          <nav class="flex-1 overflow-y-auto p-2">
            <p class="text-xs text-gray-400 px-2 py-4 text-center">Загрузка проектов…</p>
          </nav>

          <!-- Analytics card placeholder (commit 10) -->
          <div class="p-4 border-t border-gray-100">
            <p class="text-xs text-gray-400 text-center">Аналитика появится здесь</p>
          </div>
        </aside>

        <!-- Main content -->
        <main class="flex-1 overflow-y-auto p-6">
          <div class="flex items-center justify-center h-full text-gray-400">
            <div class="text-center">
              <p class="text-4xl mb-3">📋</p>
              <p class="text-sm">Выберите проект в боковой панели</p>
            </div>
          </div>
        </main>

      </div>
    </div>

  </div>

</body>
</html>
