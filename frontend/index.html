<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Task Flow</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <script defer src="https://cdn.jsdelivr.net/npm/alpinejs@3.x.x/dist/cdn.min.js"></script>
  <script src="config.js"></script>
  <script src="api.js"></script>
  <script src="app.js"></script>
</head>
<body class="bg-gray-100 min-h-screen">

  <div
    x-data="{ authed: !!localStorage.getItem('token') }"
    @authenticated.window="authed = true"
    @logout.window="authed = false"
    class="min-h-screen"
  >

    <!-- ── Auth page ──────────────────────────────────────────────────────── -->
    <div
      x-show="!authed"
      x-transition
      class="flex items-center justify-center min-h-screen"
    >
      <div x-data="authApp()" class="w-full max-w-md">
        <div class="bg-white rounded-2xl shadow-md p-8">

          <div class="text-center mb-6">
            <h1 class="text-2xl font-bold text-gray-800">Task Flow</h1>
            <p class="text-sm text-gray-500 mt-1">Система управления задачами</p>
          </div>

          <div class="flex border-b border-gray-200 mb-6">
            <button
              @click="switchMode('login')"
              :class="mode === 'login'
                ? 'flex-1 py-2 text-sm font-medium text-indigo-600 border-b-2 border-indigo-600 focus:outline-none'
                : 'flex-1 py-2 text-sm font-medium text-gray-400 border-b-2 border-transparent hover:text-gray-600 focus:outline-none'"
            >Войти</button>
            <button
              @click="switchMode('register')"
              :class="mode === 'register'
                ? 'flex-1 py-2 text-sm font-medium text-indigo-600 border-b-2 border-indigo-600 focus:outline-none'
                : 'flex-1 py-2 text-sm font-medium text-gray-400 border-b-2 border-transparent hover:text-gray-600 focus:outline-none'"
            >Регистрация</button>
          </div>

          <div
            x-show="error"
            x-text="error"
            class="mb-4 rounded-lg bg-red-50 border border-red-200 text-red-700 text-sm px-3 py-2"
          ></div>

          <!-- Login form -->
          <form x-show="mode === 'login'" @submit.prevent="submit">
            <div class="mb-4">
              <label class="block text-sm font-medium text-gray-700 mb-1">Email</label>
              <input x-model="email" type="email" required placeholder="you@example.com"
                class="w-full border border-gray-300 rounded-lg px-3 py-2 text-sm focus:outline-none focus:ring-2 focus:ring-indigo-400" />
            </div>
            <div class="mb-6">
              <label class="block text-sm font-medium text-gray-700 mb-1">Пароль</label>
              <input x-model="password" type="password" required placeholder="••••••••"
                class="w-full border border-gray-300 rounded-lg px-3 py-2 text-sm focus:outline-none focus:ring-2 focus:ring-indigo-400" />
            </div>
            <button type="submit" :disabled="loading"
              class="w-full bg-indigo-600 hover:bg-indigo-700 disabled:opacity-50 text-white font-medium py-2 rounded-lg text-sm transition-colors">
              <span x-text="loading ? 'Входим…' : 'Войти'"></span>
            </button>
          </form>

          <!-- Register form -->
          <form x-show="mode === 'register'" @submit.prevent="submit">
            <div class="mb-4">
              <label class="block text-sm font-medium text-gray-700 mb-1">Email</label>
              <input x-model="email" type="email" required placeholder="you@example.com"
                class="w-full border border-gray-300 rounded-lg px-3 py-2 text-sm focus:outline-none focus:ring-2 focus:ring-indigo-400" />
            </div>
            <div class="mb-4">
              <label class="block text-sm font-medium text-gray-700 mb-1">Имя пользователя</label>
              <input x-model="username" type="text" required placeholder="johndoe"
                class="w-full border border-gray-300 rounded-lg px-3 py-2 text-sm focus:outline-none focus:ring-2 focus:ring-indigo-400" />
            </div>
            <div class="mb-6">
              <label class="block text-sm font-medium text-gray-700 mb-1">Пароль</label>
              <input x-model="password" type="password" required placeholder="••••••••"
                class="w-full border border-gray-300 rounded-lg px-3 py-2 text-sm focus:outline-none focus:ring-2 focus:ring-indigo-400" />
            </div>
            <button type="submit" :disabled="loading"
              class="w-full bg-indigo-600 hover:bg-indigo-700 disabled:opacity-50 text-white font-medium py-2 rounded-lg text-sm transition-colors">
              <span x-text="loading ? 'Создаём…' : 'Создать аккаунт'"></span>
            </button>
          </form>

        </div>
      </div>
    </div>

    <!-- ── Dashboard ──────────────────────────────────────────────────────── -->
    <!--
      @authenticated.window="init()" is critical: dashboardApp() is mounted once
      on page load (before any login), so x-data runs without a token. We need
      init() to run again *after* the user logs in and the token is saved.
      The authApp dispatches "authenticated" on success — this listener catches it.
    -->
    <div
      x-show="authed"
      x-data="dashboardApp()"
      x-transition
      @unauthorized.window="logout()"
      @authenticated.window="init()"
      class="flex flex-col min-h-screen"
    >

      <!-- Toast notification -->
      <div
        x-show="toastVisible"
        x-transition:enter="transition ease-out duration-200"
        x-transition:enter-start="opacity-0 -translate-y-2"
        x-transition:enter-end="opacity-100 translate-y-0"
        x-transition:leave="transition ease-in duration-150"
        x-transition:leave-start="opacity-100 translate-y-0"
        x-transition:leave-end="opacity-0 -translate-y-2"
        class="fixed top-4 left-1/2 -translate-x-1/2 z-50 bg-red-600 text-white text-sm font-medium px-5 py-3 rounded-xl shadow-lg"
        x-text="toastMessage"
      ></div>

      <!-- Header -->
      <header class="bg-white border-b border-gray-200 px-6 py-3 flex items-center justify-between shrink-0">
        <span class="text-lg font-bold text-indigo-600">Task Flow</span>
        <div class="flex items-center gap-4">
          <span class="text-sm text-gray-600" x-text="username"></span>
          <button
            @click="logout()"
            class="text-sm text-gray-500 hover:text-red-500 transition-colors"
          >Выйти</button>
        </div>
      </header>

      <!-- Body: sidebar + main -->
      <div class="flex flex-1 overflow-hidden">

        <!-- Sidebar -->
        <aside class="w-64 bg-white border-r border-gray-200 flex flex-col shrink-0">

          <!-- Sidebar header -->
          <div class="p-4 border-b border-gray-100 flex items-center justify-between">
            <span class="text-xs font-semibold text-gray-500 uppercase tracking-wider">Проекты</span>
            <button
              @click="showNewProjectForm = !showNewProjectForm; newProjectTitle = ''"
              class="text-indigo-500 hover:text-indigo-700 text-lg leading-none font-bold"
              title="Новый проект"
            >+</button>
          </div>

          <!-- Inline new project form -->
          <div x-show="showNewProjectForm" x-transition class="px-3 py-2 border-b border-gray-100">
            <form @submit.prevent="submitNewProject()">
              <input
                x-model="newProjectTitle"
                x-ref="projectInput"
                x-init="$watch('showNewProjectForm', v => v && $nextTick(() => $refs.projectInput.focus()))"
                type="text"
                placeholder="Название проекта"
                required
                class="w-full border border-gray-300 rounded px-2 py-1 text-sm focus:outline-none focus:ring-2 focus:ring-indigo-400"
              />
              <div class="flex gap-2 mt-2">
                <button type="submit"
                  class="flex-1 bg-indigo-600 hover:bg-indigo-700 text-white text-xs font-medium py-1 rounded transition-colors">
                  Создать
                </button>
                <button type="button" @click="showNewProjectForm = false"
                  class="flex-1 bg-gray-100 hover:bg-gray-200 text-gray-600 text-xs font-medium py-1 rounded transition-colors">
                  Отмена
                </button>
              </div>
            </form>
          </div>

          <!-- Project list -->
          <nav class="flex-1 overflow-y-auto p-2">

            <!-- Loading state -->
            <div x-show="projectsLoading" class="flex justify-center py-6">
              <svg class="animate-spin h-5 w-5 text-indigo-400" fill="none" viewBox="0 0 24 24">
                <circle class="opacity-25" cx="12" cy="12" r="10" stroke="currentColor" stroke-width="4"></circle>
                <path class="opacity-75" fill="currentColor" d="M4 12a8 8 0 018-8v8z"></path>
              </svg>
            </div>

            <!-- Empty state -->
            <p
              x-show="!projectsLoading && projects.length === 0"
              class="text-xs text-gray-400 px-2 py-4 text-center"
            >Нет проектов. Создайте первый!</p>

            <!-- Project items -->
            <template x-for="project in projects" :key="project.id">
              <button
                @click="selectProject(project)"
                :class="currentProject && currentProject.id === project.id
                  ? 'w-full text-left px-3 py-2 rounded-lg text-sm font-medium bg-indigo-50 text-indigo-700'
                  : 'w-full text-left px-3 py-2 rounded-lg text-sm text-gray-700 hover:bg-gray-100'"
              >
                <span class="truncate block" x-text="project.title"></span>
              </button>
            </template>

          </nav>

          <!-- Analytics card -->
          <div x-show="analytics" class="p-4 border-t border-gray-100 space-y-3">
            <p class="text-xs font-semibold text-gray-500 uppercase tracking-wider">Аналитика</p>

            <!-- Progress bar -->
            <div>
              <div class="flex justify-between text-xs text-gray-500 mb-1">
                <span>Выполнено</span>
                <span x-text="(analytics?.completion_rate ?? 0).toFixed(0) + '%'"></span>
              </div>
              <div class="w-full bg-gray-200 rounded-full h-2">
                <div
                  class="bg-indigo-500 h-2 rounded-full transition-all duration-500"
                  :style="`width: ${analytics?.completion_rate ?? 0}%`"
                ></div>
              </div>
            </div>

            <!-- Counters -->
            <div class="grid grid-cols-2 gap-2 text-center">
              <div class="bg-gray-50 rounded-lg py-2">
                <p class="text-lg font-bold text-gray-800" x-text="analytics?.total ?? 0"></p>
                <p class="text-xs text-gray-400">Всего</p>
              </div>
              <div class="bg-green-50 rounded-lg py-2">
                <p class="text-lg font-bold text-green-700" x-text="analytics?.done ?? 0"></p>
                <p class="text-xs text-gray-400">Готово</p>
              </div>
              <div class="bg-blue-50 rounded-lg py-2">
                <p class="text-lg font-bold text-blue-700" x-text="analytics?.in_progress ?? 0"></p>
                <p class="text-xs text-gray-400">В работе</p>
              </div>
              <div class="bg-gray-50 rounded-lg py-2">
                <p class="text-lg font-bold text-gray-700" x-text="analytics?.todo ?? 0"></p>
                <p class="text-xs text-gray-400">Ожидает</p>
              </div>
            </div>

            <!-- Avg completion time -->
            <div x-show="analytics?.avg_completion_hours > 0" class="text-center">
              <p class="text-xs text-gray-400">
                Среднее время выполнения:
                <span class="font-medium text-gray-600" x-text="(analytics?.avg_completion_hours ?? 0).toFixed(1) + ' ч'"></span>
              </p>
            </div>
          </div>

          <!-- Analytics empty state -->
          <div x-show="currentProject && !analytics" class="p-4 border-t border-gray-100">
            <p class="text-xs text-gray-400 text-center">Нет данных для аналитики</p>
          </div>

        </aside>

        <!-- Main content -->
        <main class="flex-1 overflow-y-auto p-6">

          <!-- No project selected -->
          <div x-show="!currentProject" class="flex items-center justify-center h-full text-gray-400">
            <div class="text-center">
              <p class="text-4xl mb-3">📋</p>
              <p class="text-sm">Выберите проект в боковой панели</p>
            </div>
          </div>

          <!-- Project selected -->
          <div x-show="currentProject">
            <!-- Project title -->
            <div class="flex items-center justify-between mb-6">
              <h2 class="text-xl font-bold text-gray-800" x-text="currentProject && currentProject.title"></h2>
            </div>

            <!-- Tasks toolbar -->
            <div class="flex items-center justify-between mb-4">
              <select
                x-model="statusFilter"
                class="border border-gray-300 rounded-lg px-3 py-1.5 text-sm text-gray-700 focus:outline-none focus:ring-2 focus:ring-indigo-400"
              >
                <option value="all">Все статусы</option>
                <option value="todo">Ожидает</option>
                <option value="in_progress">В работе</option>
                <option value="done">Готово</option>
                <option value="cancelled">Отменено</option>
              </select>
              <button
                @click="showNewTaskForm = !showNewTaskForm; newTask = { title: '', description: '' }"
                class="bg-indigo-600 hover:bg-indigo-700 text-white text-sm font-medium px-3 py-1.5 rounded-lg transition-colors"
              >+ Задача</button>
            </div>

            <!-- New task form -->
            <div x-show="showNewTaskForm" x-transition class="bg-white rounded-xl border border-indigo-200 p-4 mb-4">
              <form @submit.prevent="submitNewTask()">
                <div class="mb-3">
                  <input
                    x-model="newTask.title"
                    x-ref="taskTitleInput"
                    x-init="$watch('showNewTaskForm', v => v && $nextTick(() => $refs.taskTitleInput.focus()))"
                    type="text"
                    placeholder="Название задачи"
                    required
                    class="w-full border border-gray-300 rounded-lg px-3 py-2 text-sm focus:outline-none focus:ring-2 focus:ring-indigo-400"
                  />
                </div>
                <div class="mb-3">
                  <textarea
                    x-model="newTask.description"
                    placeholder="Описание (необязательно)"
                    rows="2"
                    class="w-full border border-gray-300 rounded-lg px-3 py-2 text-sm focus:outline-none focus:ring-2 focus:ring-indigo-400 resize-none"
                  ></textarea>
                </div>
                <div class="flex gap-2">
                  <button
                    type="submit"
                    :disabled="taskSaving"
                    class="bg-indigo-600 hover:bg-indigo-700 disabled:opacity-50 text-white text-sm font-medium px-4 py-1.5 rounded-lg transition-colors"
                  >
                    <span x-text="taskSaving ? 'Создаём…' : 'Создать'"></span>
                  </button>
                  <button
                    type="button"
                    @click="showNewTaskForm = false"
                    class="bg-gray-100 hover:bg-gray-200 text-gray-600 text-sm font-medium px-4 py-1.5 rounded-lg transition-colors"
                  >Отмена</button>
                </div>
              </form>
            </div>

            <!-- Loading spinner -->
            <div x-show="tasksLoading" class="flex justify-center py-10">
              <svg class="animate-spin h-6 w-6 text-indigo-400" fill="none" viewBox="0 0 24 24">
                <circle class="opacity-25" cx="12" cy="12" r="10" stroke="currentColor" stroke-width="4"></circle>
                <path class="opacity-75" fill="currentColor" d="M4 12a8 8 0 018-8v8z"></path>
              </svg>
            </div>

            <!-- Empty state -->
            <div
              x-show="!tasksLoading && filteredTasks.length === 0"
              class="bg-white rounded-xl border border-gray-200 p-10 text-center text-gray-400"
            >
              <p class="text-3xl mb-2">✅</p>
              <p class="text-sm" x-text="statusFilter === 'all' ? 'Задач пока нет' : 'Нет задач с таким статусом'"></p>
            </div>

            <!-- Task list -->
            <div x-show="!tasksLoading && filteredTasks.length > 0" class="space-y-2">
              <template x-for="task in filteredTasks" :key="task.id">
                <div class="bg-white rounded-xl border border-gray-200 px-4 py-3 flex items-center gap-3">

                  <!-- Status badge -->
                  <span
                    class="shrink-0 text-xs font-medium px-2 py-0.5 rounded-full"
                    :class="statusBadgeClass(task.status)"
                    x-text="statusLabel(task.status)"
                  ></span>

                  <!-- Title + date -->
                  <div class="flex-1 min-w-0">
                    <p class="text-sm font-medium text-gray-800 truncate" x-text="task.title"></p>
                    <p class="text-xs text-gray-400 mt-0.5"
                       x-text="new Date(task.created_at).toLocaleDateString('ru-RU')"></p>
                  </div>

                  <!-- Inline status dropdown -->
                  <select
                    :value="task.status"
                    @change="changeStatus(task.id, $event.target.value)"
                    class="border border-gray-200 rounded-lg px-2 py-1 text-xs text-gray-600 focus:outline-none focus:ring-2 focus:ring-indigo-400 bg-white"
                  >
                    <option value="todo">Ожидает</option>
                    <option value="in_progress">В работе</option>
                    <option value="done">Готово</option>
                    <option value="cancelled">Отменено</option>
                  </select>

                  <!-- Delete button -->
                  <button
                    @click="removeTask(task.id)"
                    class="shrink-0 text-gray-300 hover:text-red-500 transition-colors text-lg leading-none"
                    title="Удалить задачу"
                  >✕</button>

                </div>
              </template>
            </div>
          </div>

        </main>

      </div>
    </div>

  </div>

</body>
</html>
