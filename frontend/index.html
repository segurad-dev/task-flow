<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Task Flow</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <script defer src="https://cdn.jsdelivr.net/npm/alpinejs@3.x.x/dist/cdn.min.js"></script>
  <script src="config.js"></script>
  <script src="api.js"></script>
  <script src="app.js"></script>
</head>
<body class="bg-gray-100 min-h-screen">

  <!--
    Top-level Alpine component listens for the custom 'authenticated' event
    dispatched by authApp, and toggles between the auth card and the dashboard.
  -->
  <div
    x-data="{ authed: !!localStorage.getItem('token') }"
    @authenticated.window="authed = true"
    @logout.window="authed = false"
    class="min-h-screen"
  >

    <!-- ── Auth page ──────────────────────────────────────────────────────── -->
    <div
      x-show="!authed"
      x-transition
      class="flex items-center justify-center min-h-screen"
    >
      <div x-data="authApp()" class="w-full max-w-md">

        <div class="bg-white rounded-2xl shadow-md p-8">

          <!-- Title -->
          <div class="text-center mb-6">
            <h1 class="text-2xl font-bold text-gray-800">Task Flow</h1>
            <p class="text-sm text-gray-500 mt-1">Система управления задачами</p>
          </div>

          <!-- Tabs -->
          <div class="flex border-b border-gray-200 mb-6">
            <button
              @click="switchMode('login')"
              :class="mode === 'login'
                ? 'flex-1 py-2 text-sm font-medium text-indigo-600 border-b-2 border-indigo-600 focus:outline-none'
                : 'flex-1 py-2 text-sm font-medium text-gray-400 border-b-2 border-transparent hover:text-gray-600 focus:outline-none'"
            >Войти</button>
            <button
              @click="switchMode('register')"
              :class="mode === 'register'
                ? 'flex-1 py-2 text-sm font-medium text-indigo-600 border-b-2 border-indigo-600 focus:outline-none'
                : 'flex-1 py-2 text-sm font-medium text-gray-400 border-b-2 border-transparent hover:text-gray-600 focus:outline-none'"
            >Регистрация</button>
          </div>

          <!-- Error banner -->
          <div
            x-show="error"
            x-text="error"
            class="mb-4 rounded-lg bg-red-50 border border-red-200 text-red-700 text-sm px-3 py-2"
          ></div>

          <!-- Login form -->
          <form x-show="mode === 'login'" @submit.prevent="submit">
            <div class="mb-4">
              <label class="block text-sm font-medium text-gray-700 mb-1">Email</label>
              <input
                x-model="email"
                type="email"
                required
                placeholder="you@example.com"
                class="w-full border border-gray-300 rounded-lg px-3 py-2 text-sm focus:outline-none focus:ring-2 focus:ring-indigo-400"
              />
            </div>
            <div class="mb-6">
              <label class="block text-sm font-medium text-gray-700 mb-1">Пароль</label>
              <input
                x-model="password"
                type="password"
                required
                placeholder="••••••••"
                class="w-full border border-gray-300 rounded-lg px-3 py-2 text-sm focus:outline-none focus:ring-2 focus:ring-indigo-400"
              />
            </div>
            <button
              type="submit"
              :disabled="loading"
              class="w-full bg-indigo-600 hover:bg-indigo-700 disabled:opacity-50 text-white font-medium py-2 rounded-lg text-sm transition-colors"
            >
              <span x-text="loading ? 'Входим…' : 'Войти'"></span>
            </button>
          </form>

          <!-- Register form -->
          <form x-show="mode === 'register'" @submit.prevent="submit">
            <div class="mb-4">
              <label class="block text-sm font-medium text-gray-700 mb-1">Email</label>
              <input
                x-model="email"
                type="email"
                required
                placeholder="you@example.com"
                class="w-full border border-gray-300 rounded-lg px-3 py-2 text-sm focus:outline-none focus:ring-2 focus:ring-indigo-400"
              />
            </div>
            <div class="mb-4">
              <label class="block text-sm font-medium text-gray-700 mb-1">Имя пользователя</label>
              <input
                x-model="username"
                type="text"
                required
                placeholder="johndoe"
                class="w-full border border-gray-300 rounded-lg px-3 py-2 text-sm focus:outline-none focus:ring-2 focus:ring-indigo-400"
              />
            </div>
            <div class="mb-6">
              <label class="block text-sm font-medium text-gray-700 mb-1">Пароль</label>
              <input
                x-model="password"
                type="password"
                required
                placeholder="••••••••"
                class="w-full border border-gray-300 rounded-lg px-3 py-2 text-sm focus:outline-none focus:ring-2 focus:ring-indigo-400"
              />
            </div>
            <button
              type="submit"
              :disabled="loading"
              class="w-full bg-indigo-600 hover:bg-indigo-700 disabled:opacity-50 text-white font-medium py-2 rounded-lg text-sm transition-colors"
            >
              <span x-text="loading ? 'Создаём…' : 'Создать аккаунт'"></span>
            </button>
          </form>

        </div>
      </div>
    </div>

    <!-- ── Dashboard placeholder (replaced in commit 5) ──────────────────── -->
    <div x-show="authed" x-transition class="p-8 text-center text-gray-500">
      <p class="text-lg font-medium">Вы вошли в систему ✓</p>
      <p class="text-sm mt-1">Дашборд появится в следующих коммитах</p>
      <button
        @click="localStorage.clear(); $dispatch('logout')"
        class="mt-4 text-sm text-indigo-600 hover:underline"
      >Выйти</button>
    </div>

  </div>

</body>
</html>
